[project]
name = "agentic-data-reliability-investigator"
version = "0.1.0"
description = "Read-only multi-agent diagnosis of data-reliability incidents, with deterministic guardrails, evaluation, and human oversight"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    "mcp>=1.2.0",
    "langchain-mcp-adapters>=0.1.0",
    "pydantic>=2.7.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0",
    "faiss-cpu>=1.15.0",
    "numpy>=2.5.2",
    "langgraph-checkpoint-sqlite>=2.0.0",
    "aiosqlite>=0.20",
    "httpx>=0.27",
    # Already present transitively via langchain-core, but this project imports it
    # directly (M5.2 tracing), and a dependency you import is a dependency you declare.
    "langsmith>=0.11",
]

[project.optional-dependencies]
# The UI is optional: the CLI, the harness and the whole test suite run without it, and
# a demo dependency has no business in a core install.
ui = ["streamlit>=1.40"]

[project.scripts]
investigator = "investigator.app:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
    "coverage>=7.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/investigator", "mcp_servers"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "mcp_servers", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# UP042: keep `str, Enum` (StrEnum swap is behaviourally risky for serialization);
# UP047: PEP 695 type params not required for these small generic helpers.
ignore = ["B008", "UP042", "UP047"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
warn_unused_ignores = false
namespace_packages = true
explicit_package_bases = true
mypy_path = "src"
